<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full Stack Developer — Portfolio</title>
<meta name="description" content="Full Stack Developer specializing in React, Node.js, GraphQL, AWS Serverless and AI-powered applications." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1628;
    --bg-panel:#0F2038;
    --bg-panel-alt:#13294D;
    --grid-line: rgba(148,180,214,0.07);
    --line-strong: rgba(148,180,214,0.20);
    --text-primary:#E8EEF5;
    --text-muted:#8CA3C4;
    --text-dim:#5C7392;
    --amber:#FF9F1C;
    --cyan:#5EEAD4;
    --cyan-dim: rgba(94,234,212,0.14);
    --amber-dim: rgba(255,159,28,0.14);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --maxw: 1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, transparent 1px, transparent 40px, var(--grid-line) 41px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, transparent 1px, transparent 40px, var(--grid-line) 41px),
      var(--bg);
    color:var(--text-primary);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--amber); color:#0A1628;}
  :focus-visible{outline:2px solid var(--cyan); outline-offset:3px;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  /* ---------- crop marks ---------- */
  .crop{position:absolute; width:16px; height:16px; pointer-events:none;}
  .crop::before, .crop::after{content:""; position:absolute; background:var(--line-strong);}
  .crop::before{width:16px; height:1px; top:0; left:0;}
  .crop::after{width:1px; height:16px; top:0; left:0;}
  .crop.tr{right:0; left:auto;}
  .crop.tr::before{right:0; left:auto;}
  .crop.tr::after{right:0; left:auto;}
  .crop.bl{bottom:0; top:auto;}
  .crop.bl::before{bottom:0; top:auto;}
  .crop.bl::after{bottom:0; top:auto;}
  .crop.br{bottom:0; top:auto; right:0; left:auto;}
  .crop.br::before{bottom:0; top:auto; right:0; left:auto;}
  .crop.br::after{bottom:0; top:auto; right:0; left:auto;}

  /* ---------- nav ---------- */
  header.nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,22,40,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-strong);
  }
  .nav-inner{display:flex; align-items:center; justify-content:space-between; height:64px;}
  .brand{font-family:var(--font-mono); font-size:13px; letter-spacing:0.08em; color:var(--text-primary); display:flex; align-items:center; gap:8px;}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  nav.links{display:flex; gap:28px; font-family:var(--font-mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted);}
  nav.links a{position:relative; padding:4px 0; transition:color .2s;}
  nav.links a:hover{color:var(--cyan);}
  .nav-cta{font-family:var(--font-mono); font-size:12px; letter-spacing:0.05em; border:1px solid var(--amber); color:var(--amber); padding:7px 14px; border-radius:2px; transition:all .2s;}
  .nav-cta:hover{background:var(--amber); color:#0A1628;}
  @media (max-width:800px){ nav.links{display:none;} }

  /* ---------- section title block ---------- */
  .sheet-head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:48px; border-bottom:1px solid var(--line-strong); padding-bottom:18px;}
  .sheet-num{font-family:var(--font-mono); font-size:12px; color:var(--cyan); letter-spacing:0.1em;}
  .sheet-title{font-family:var(--font-display); font-size:clamp(28px,4vw,42px); font-weight:600; letter-spacing:-0.01em; margin-top:4px;}
  .sheet-tag{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-align:right; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap;}

  section{position:relative; padding:100px 0; border-bottom:1px dashed var(--grid-line);}
  section .wrap{position:relative;}

  .reveal{opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1; transform:none; transition:none;} }

  /* ---------- hero ---------- */
  .hero{padding-top:64px; min-height:92vh; display:flex; align-items:center;}
  .hero-grid{display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center; width:100%;}
  @media (max-width:960px){ .hero-grid{grid-template-columns:1fr;} .hero{min-height:auto; padding-top:48px;} }

  .eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--amber); letter-spacing:0.14em; text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .eyebrow::before{content:""; width:22px; height:1px; background:var(--amber);}
  h1.hero-title{font-family:var(--font-display); font-size:clamp(38px,5.6vw,64px); font-weight:700; line-height:1.05; letter-spacing:-0.02em;}
  h1.hero-title .accent{color:var(--cyan);}
  .hero-sub{margin-top:24px; font-size:17px; color:var(--text-muted); max-width:520px;}
  .hero-actions{display:flex; gap:14px; margin-top:36px; flex-wrap:wrap;}
  .btn{font-family:var(--font-mono); font-size:13px; letter-spacing:0.04em; padding:13px 22px; border-radius:2px; transition:all .2s; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--amber); color:#0A1628; font-weight:600;}
  .btn-primary:hover{background:#ffb347; transform:translateY(-1px);}
  .btn-ghost{border:1px solid var(--line-strong); color:var(--text-primary);}
  .btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}

  .stack-strip{margin-top:44px; display:flex; gap:10px; flex-wrap:wrap;}
  .stack-strip span{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); border:1px solid var(--grid-line); padding:5px 10px; border-radius:2px;}

  /* ---------- diagram ---------- */
  .diagram-frame{position:relative; border:1px solid var(--line-strong); border-radius:4px; background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent); padding:18px;}
  .diagram-frame .label{position:absolute; top:-11px; left:16px; background:var(--bg); padding:0 8px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase;}
  .node-tip{font-family:var(--font-mono); font-size:11px; fill:var(--text-muted);}
  .node-label{font-family:var(--font-display); font-size:12.5px; font-weight:600; fill:var(--text-primary);}

  /* ---------- skills ---------- */
  .skill-groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1px; background:var(--grid-line); border:1px solid var(--line-strong);}
  .skill-card{background:var(--bg); padding:26px 24px;}
  .skill-card h3{font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); margin-bottom:16px;}
  .skill-card ul{list-style:none;}
  .skill-card li{font-size:14px; color:var(--text-muted); padding:5px 0; display:flex; align-items:center; gap:9px;}
  .skill-card li::before{content:""; width:5px; height:5px; background:var(--amber); flex-shrink:0;}

  /* ---------- experience ---------- */
  .timeline{position:relative; padding-left:40px;}
  .timeline::before{content:""; position:absolute; left:7px; top:6px; bottom:6px; width:1px; background:var(--line-strong);}
  .tl-item{position:relative; padding-bottom:56px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{position:absolute; left:-40px; top:4px; width:15px; height:15px; border-radius:50%; background:var(--bg); border:2px solid var(--amber);}
  .tl-item.current .tl-dot{background:var(--amber); box-shadow:0 0 0 4px var(--amber-dim);}
  .tl-role-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .tl-role{font-family:var(--font-display); font-size:21px; font-weight:600;}
  .tl-badge{font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); padding:2px 8px; border-radius:10px;}
  .tl-company{font-family:var(--font-mono); font-size:13px; color:var(--cyan); margin-bottom:14px;}
  .tl-desc{color:var(--text-muted); font-size:14.5px; max-width:640px;}
  .tl-desc ul{margin-top:10px; padding-left:18px;}
  .tl-desc li{margin-bottom:6px;}

  /* ---------- projects ---------- */
  .proj-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;}
  .proj-card{border:1px solid var(--line-strong); border-radius:4px; padding:26px; background:rgba(255,255,255,0.012); position:relative; transition:border-color .2s, transform .2s;}
  .proj-card:hover{border-color:var(--cyan); transform:translateY(-3px);}
  .proj-idx{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;}
  .proj-title{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:10px;}
  .proj-desc{font-size:13.5px; color:var(--text-muted); margin-bottom:16px;}
  .proj-tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .proj-tags span{font-family:var(--font-mono); font-size:10.5px; color:var(--cyan); background:var(--cyan-dim); padding:3px 8px; border-radius:2px;}
  .proj-challenge{font-size:12.5px; color:var(--text-dim); border-top:1px dashed var(--grid-line); padding-top:12px;}
  .proj-challenge b{color:var(--amber); font-family:var(--font-mono); font-weight:600; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; display:block; margin-bottom:5px;}

  /* project flip cards */
  .flip-card.proj-flip{height:320px;}
  .flip-card.proj-flip:focus-visible{outline:2px solid var(--cyan); outline-offset:4px;}
  .proj-flip-front, .proj-flip-back{padding:26px; display:flex; flex-direction:column; height:100%;}
  .proj-flip-front:hover{border-color:var(--cyan);}
  .proj-flip .proj-desc{flex:1;}
  .proj-flip-back{background:var(--bg-panel); transform:rotateY(180deg);}
  .proj-flip-back .proj-challenge{border-top:none; padding-top:0; flex:1;}
  .proj-flip-back .fb-desc{font-size:13px; color:var(--text-muted); line-height:1.6;}
  .proj-flip-hint{font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); margin-top:14px;}

  /* ---------- debug log ---------- */
  .log{border:1px solid var(--line-strong); border-radius:4px; overflow:hidden;}
  .log-row{display:grid; grid-template-columns:70px 1fr 140px; gap:16px; padding:14px 20px; font-size:13.5px; border-bottom:1px solid var(--grid-line); align-items:center;}
  .log-row:last-child{border-bottom:none;}
  .log-row:hover{background:rgba(255,255,255,0.02);}
  .log-id{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .log-status{font-family:var(--font-mono); font-size:10.5px; color:var(--cyan); text-align:right; letter-spacing:0.06em;}
  .log-status::before{content:"● "; }
  .log-issue{color:var(--text-primary);}
  @media (max-width:640px){ .log-row{grid-template-columns:1fr; gap:4px;} .log-status{text-align:left;} }

  /* ---------- contact / title block ---------- */
  .titleblock{border:1px solid var(--line-strong); border-radius:4px; padding:40px; position:relative;}
  .tb-top{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:32px;}
  .tb-heading{font-family:var(--font-display); font-size:clamp(26px,4vw,38px); font-weight:600; max-width:480px;}
  .tb-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:20px; border-top:1px solid var(--grid-line); padding-top:24px;}
  .tb-field span{display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px;}
  .tb-field a, .tb-field p{font-size:14px; color:var(--text-primary);}
  .tb-field a:hover{color:var(--cyan);}
  footer{padding:32px 0; text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}

  .note{font-size:12px; color:var(--text-dim); margin-top:10px; font-style:italic;}

  /* ---------- field photos (flip cards with multi-photo stacks) ---------- */
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:30px;}
  .flip-card{perspective:1400px; height:340px;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .65s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:4px; border:1px solid var(--line-strong); overflow:hidden; background:var(--bg);}
  .flip-front{display:flex; flex-direction:column;}

  /* stacked-prints photo area */
  .flip-photo{flex:1; position:relative; overflow:visible; margin:16px 16px 0 16px;}
  .stack-layer{position:absolute; inset:0; border:1px solid var(--line-strong); border-radius:3px; background:var(--bg-panel-alt); transition:transform .3s ease, opacity .3s ease;}
  .stack-layer.behind-2{transform:rotate(-6deg) translate(-3px,3px); opacity:0.5; z-index:1;}
  .stack-layer.behind-1{transform:rotate(4deg) translate(3px,2px); opacity:0.7; z-index:2;}
  .stack-layer.active-photo{z-index:3; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .stack-layer.active-photo img{width:100%; height:100%; object-fit:cover; display:block;}

  /* card-shuffle transition between photos */
  .stack-layer.shuffle-exit{z-index:6; transition:transform .38s cubic-bezier(.4,.1,.3,1), opacity .38s ease;}
  .stack-layer.shuffle-exit.to-right.go{transform:translateX(46px) rotate(13deg) scale(0.9); opacity:0;}
  .stack-layer.shuffle-exit.to-left.go{transform:translateX(-46px) rotate(-13deg) scale(0.9); opacity:0;}
  .stack-layer.shuffle-enter{z-index:2; transition:transform .38s cubic-bezier(.4,.1,.3,1), opacity .38s ease;}
  .stack-layer.shuffle-enter.from-left{transform:translateX(-46px) rotate(-13deg) scale(0.9); opacity:0;}
  .stack-layer.shuffle-enter.from-right{transform:translateX(46px) rotate(13deg) scale(0.9); opacity:0;}
  .stack-layer.shuffle-enter.go{transform:none; opacity:1;}
  .ph-fallback{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-align:center; padding:10px; line-height:1.5;}
  .ph-tag{position:absolute; top:8px; left:8px; z-index:4; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; background:rgba(10,22,40,0.82); color:var(--cyan); border:1px solid var(--line-strong); padding:3px 8px; border-radius:2px;}
  .ph-count{position:absolute; top:8px; right:8px; z-index:4; font-family:var(--font-mono); font-size:9px; letter-spacing:0.05em; color:var(--text-dim); background:rgba(10,22,40,0.82); border:1px solid var(--line-strong); padding:3px 7px; border-radius:2px;}

  .ph-arrow{position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong); background:rgba(10,22,40,0.82); color:var(--text-primary); font-family:var(--font-mono); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .2s, color .2s;}
  .ph-arrow:hover{border-color:var(--cyan); color:var(--cyan);}
  .ph-arrow.prev{left:6px;}
  .ph-arrow.next{right:6px;}
  .ph-dots{position:absolute; bottom:7px; left:0; right:0; z-index:4; display:flex; justify-content:center; gap:6px;}
  .ph-dot{width:5px; height:5px; border-radius:50%; border:none; background:var(--text-dim); cursor:pointer; padding:0;}
  .ph-dot.on{background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim);}

  .flip-caption{padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .flip-caption .fc-text .ft{font-family:var(--font-display); font-size:14px; font-weight:600;}
  .flip-caption .fc-text .fs{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-top:2px;}
  .flip-btn{all:unset; cursor:pointer; flex-shrink:0; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); padding:6px 10px; border-radius:2px; transition:all .2s;}
  .flip-btn:hover{background:var(--amber); color:#0A1628;}
  .flip-btn:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  .flip-back{background:var(--bg-panel); transform:rotateY(180deg); padding:22px; display:flex; flex-direction:column;}
  .flip-back .fb-num{font-family:var(--font-mono); font-size:10px; color:var(--amber); letter-spacing:0.1em; margin-bottom:10px;}
  .flip-back .fb-title{font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:8px;}
  .flip-back .fb-desc{font-size:12.5px; color:var(--text-muted); line-height:1.55; flex:1;}
  .fb-thumbs{display:flex; gap:6px; margin:14px 0;}
  .fb-thumb{width:34px; height:34px; border-radius:2px; border:1px solid var(--line-strong); overflow:hidden; background:var(--bg-panel-alt); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:8px; color:var(--text-dim); flex-shrink:0;}
  .fb-thumb img{width:100%; height:100%; object-fit:cover;}
  .flip-btn.back-btn{align-self:flex-start;}
  .gallery-note{margin-top:22px;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-type="module">
const {useEffect, useRef, useState} = React;

/* ---------- scroll reveal hook ---------- */
function useReveal(){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ setInView(true); obs.unobserve(el); } });
    }, {threshold:0.12});
    obs.observe(el);
    return ()=>obs.disconnect();
  },[]);
  return [ref, inView];
}

function Reveal({children, as:Tag="div", className="", style}){
  const [ref, inView] = useReveal();
  return <Tag ref={ref} className={`reveal ${inView?"in":""} ${className}`} style={style}>{children}</Tag>;
}

function Crops(){
  return <React.Fragment>
    <span className="crop tl"></span><span className="crop tr"></span>
    <span className="crop bl"></span><span className="crop br"></span>
  </React.Fragment>;
}

/* ---------- Nav ---------- */
function Nav(){
  return (
    <header className="nav">
      <div className="wrap nav-inner">
        <a href="#top" className="brand"><span className="dot"></span>PORTFOLIO / FSD-01</a>
        <nav className="links">
          <a href="#systems">Systems</a>
          <a href="#timeline">Timeline</a>
          <a href="#builds">Builds</a>
          <a href="#photos">Photos</a>
          <a href="#debug">Debug&nbsp;Log</a>
        </nav>
        <a href="#contact" className="nav-cta">Contact</a>
      </div>
    </header>
  );
}

/* ---------- Hero diagram (signature element) ---------- */
function ArchDiagram(){
  const nodes = [
    {x:40, y:40, w:120, h:46, title:"CLIENT", sub:"React / Next.js"},
    {x:220, y:110, w:120, h:46, title:"API", sub:"GraphQL"},
    {x:40, y:180, w:150, h:46, title:"COMPUTE", sub:"Node.js + Lambda"},
    {x:220, y:250, w:130, h:46, title:"DATA", sub:"MongoDB / DynamoDB"},
    {x:40, y:320, w:150, h:46, title:"DELIVERY", sub:"S3 + CloudFront"},
  ];
  // paths connecting node centers, roughly orthogonal
  const paths = [
    "M100,86 L100,110 L280,110 L280,110", // client -> api (down then right) approx
    "M220,133 L115,133 L115,180",         // api -> compute
    "M115,226 L115,250 L280,250 L280,250",// compute -> data
    "M220,273 L115,273 L115,320",         // data -> delivery
  ];
  return (
    <div className="diagram-frame">
      <span className="label">System Diagram — request lifecycle</span>
      <svg viewBox="0 0 400 400" width="100%" role="img" aria-label="Architecture diagram showing a React client calling a GraphQL API, handled by Node.js and AWS Lambda compute, backed by MongoDB and DynamoDB, delivered via S3 and CloudFront.">
        <defs>

            <text x={n.x+14} y={n.y+35} className="node-tip">{n.sub}</text>

function PhotoStack({photos, tag, title}){
  const [idx, setIdx] = useState(0);
  const [anim, setAnim] = useState(null); // {dir, from, to, phase:'start'|'end'}
  const timerRef = useRef(null);
  const count = photos.length;

  useEffect(()=>()=>{ if(timerRef.current) clearTimeout(timerRef.current); },[]);

  const shuffleTo = (to, dir, e) => {
    e.stopPropagation();
    if (anim || to === idx) return;
    setAnim({dir, from:idx, to, phase:"start"});
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        setAnim(a => a ? {...a, phase:"end"} : a);
      });
    });
    timerRef.current = setTimeout(()=>{
      setIdx(to);
      setAnim(null);
    }, 380);
  };

  const go = (dir, e) => {
    const to = (idx + dir + count) % count;
    shuffleTo(to, dir, e);
  };

  const goDot = (i, e) => {
    const forward = (i - idx + count) % count;
    const backward = (idx - i + count) % count;
    const dir = forward <= backward ? 1 : -1;
    shuffleTo(i, dir, e);
  };

  const renderFace = (i) => (
    photos[i]
      ? <img src={photos[i]} alt={`${title} photo ${i+1}`} />
      : <div className="ph-fallback">// print {String(i+1).padStart(2,"0")} of {String(count).padStart(2,"0")}<br/>drop image src here</div>
  );

  return (
    <div className="flip-photo">
      {count > 2 && <div className="stack-layer behind-2"></div>}
      {count > 1 && <div className="stack-layer behind-1"></div>}

      {anim ? (
        <React.Fragment>
          <div className={`stack-layer active-photo shuffle-exit ${anim.dir>0?"to-right":"to-left"} ${anim.phase==="end"?"go":""}`}>
            {renderFace(anim.from)}
          </div>
          <div className={`stack-layer active-photo shuffle-enter ${anim.dir>0?"from-left":"from-right"} ${anim.phase==="end"?"go":""}`}>
            {renderFace(anim.to)}
          </div>
        </React.Fragment>
      ) : (
        <div className="stack-layer active-photo">
          {renderFace(idx)}
        </div>
      )}

      <span className="ph-tag">{tag}</span>
      {count > 1 && <span className="ph-count">{(anim?anim.to:idx)+1}/{count}</span>}
      {count > 1 && (
        <React.Fragment>
          <button type="button" className="ph-arrow prev" aria-label="Previous photo" onClick={(e)=>go(-1,e)}>‹</button>
          <button type="button" className="ph-arrow next" aria-label="Next photo" onClick={(e)=>go(1,e)}>›</button>
          <div className="ph-dots">
            {photos.map((_,i)=>(
              <button
                type="button"
                key={i}
                className={`ph-dot ${i===(anim?anim.to:idx)?"on":""}`}
                aria-label={`Go to photo ${i+1}`}
                onClick={(e)=>goDot(i,e)}
              />
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}
